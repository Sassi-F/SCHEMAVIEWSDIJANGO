<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<p> this is appointment list page</p>

<table style="width:100%; border-collapse:collapse; font-family:Arial, sans-serif;">
  <thead>
    <tr style="background:#f2f2f2;">
      <th style="border:1px solid #ccc; padding:8px;">ID</th>
      <th style="border:1px solid #ccc; padding:8px;">Patient Name</th>
      <th style="border:1px solid #ccc; padding:8px;">Doctor NAme</th>
    </tr>
  </thead>
  <tbody>
  {% for a in appointments %}
    <tr>
      <td style="border:1px solid #ccc; padding:8px;">{{ a.id }}</td>
      <td style="border:1px solid #ccc; padding:8px;">{{ a.patient.name }}</td>
      <td style="border:1px solid #ccc; padding:8px;"> {{ a.doctor.name }}</td>
    </tr>
{% endfor %}

  </tbody>
</table>



</body>
</html>
